
name: Build S61B Cast Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q -o S61B_Cast_Remote_Source.zip
          test -f S61B_Cast_Remote/settings.gradle
          test -f S61B_Cast_Remote/app/build.gradle
          echo "Android project extracted successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK 35
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android SDK 35 is already installed."
          else
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$SDKMANAGER" ]; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
            printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
            "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: S61B_Cast_Remote
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: S61B-Cast-Remote-debug-apk
          path: S61B_Cast_Remote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
